[package]
name = "bruce"
version = "0.14.0"
edition = "2024"
license = "MIT"
description = "A terminal workspace for Claude Code: live Git, embedded Claude, and token metrics, with per-project sessions."
repository = "https://github.com/soydanielsierradev/bruce-tui"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
# Local read-only repo access only: drop default ssh/https features to avoid
# pulling (and building) openssl-sys / libssh2-sys on Windows.
git2 = { version = "0.20.2", default-features = false }
notify = "8.2.0"
portable-pty = "0.9.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# Session IDs: a UUID Bruce owns and passes to `claude --session-id`, so the
# same id can later resume the conversation via `claude --resume`.
uuid = { version = "1.23.2", features = ["v4"] }
# Terminal emulator: parse the child's ANSI output into a cell grid we render
# ourselves (decoupled from any ratatui-version-specific widget crate).
vt100 = "0.16.2"
