name: release

# Build cross-platform binaries and attach them to a GitHub Release whenever a
# version tag is pushed (e.g. `git tag v0.8.0 && git push origin v0.8.0`).
# Every install channel (curl script, Homebrew, AUR) downloads these artifacts,
# so this workflow is the foundation the rest of distribution stands on.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Package with a STABLE per-target name (no version in it) so install
      # scripts can fetch `releases/latest/download/bruce-<target>.tar.gz`
      # without resolving the tag first. The release page still shows the
      # version.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/bruce"
          pkg="bruce-${{ matrix.target }}.tar.gz"
          tar -czf "$pkg" -C "$(dirname "$bin")" bruce
          echo "ASSET=$pkg" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pkg="bruce-${{ matrix.target }}.zip"
          # cd into the binary's dir so the zip holds bruce.exe at the root,
          # not the full target/.../release/ path.
          (cd "target/${{ matrix.target }}/release" && 7z a "$GITHUB_WORKSPACE/$pkg" bruce.exe)
          echo "ASSET=$pkg" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

  # After all binaries are published, regenerate the Homebrew formula from the
  # template (filling in the new version + SHA256s) and push it to the tap repo,
  # so `brew install` serves the new release without any manual step.
  update-tap:
    name: update Homebrew tap
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bruce-tui (for the formula template)
        uses: actions/checkout@v4

      - name: Checkout the tap repo
        uses: actions/checkout@v4
        with:
          repository: soydanielsierradev/homebrew-bruce
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Render formula and push
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          export VERSION="${tag#v}"
          export BASE="https://github.com/${{ github.repository }}/releases/download/${tag}"

          # Download each published asset and hash it.
          dl() { curl -fsSL "$BASE/$1" -o "$1"; sha256sum "$1" | cut -d' ' -f1; }
          export SHA_ARM=$(dl bruce-aarch64-apple-darwin.tar.gz)
          export SHA_INTEL=$(dl bruce-x86_64-apple-darwin.tar.gz)
          export SHA_LINUX=$(dl bruce-x86_64-unknown-linux-gnu.tar.gz)

          # Fill the template's ${...} placeholders only; leave Ruby's #{...} alone.
          mkdir -p tap/Formula
          envsubst '${VERSION} ${BASE} ${SHA_ARM} ${SHA_INTEL} ${SHA_LINUX}' \
            < packaging/homebrew/bruce.rb > tap/Formula/bruce.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/bruce.rb
          if git diff --staged --quiet; then
            echo "Formula already up to date."
          else
            git commit -m "bruce ${VERSION}"
            git push
          fi
