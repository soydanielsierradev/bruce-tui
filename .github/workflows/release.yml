name: release

# Build cross-platform binaries and attach them to a GitHub Release whenever a
# version tag is pushed (e.g. `git tag v0.8.0 && git push origin v0.8.0`).
# Every install channel (curl script, Homebrew, AUR) downloads these artifacts,
# so this workflow is the foundation the rest of distribution stands on.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Package with a STABLE per-target name (no version in it) so install
      # scripts can fetch `releases/latest/download/bruce-<target>.tar.gz`
      # without resolving the tag first. The release page still shows the
      # version.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/bruce"
          pkg="bruce-${{ matrix.target }}.tar.gz"
          tar -czf "$pkg" -C "$(dirname "$bin")" bruce
          echo "ASSET=$pkg" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/bruce.exe"
          pkg="bruce-${{ matrix.target }}.zip"
          7z a "$pkg" "$bin"
          echo "ASSET=$pkg" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
